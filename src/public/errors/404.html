<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f4f8fa" />
    <title>Page Not Found</title>
    <link rel="stylesheet" href="/assets/css/404.css" />
  </head>
  <body>
    <main class="error_page">
      <div class="glow glow_left" aria-hidden="true"></div>
      <div class="glow glow_right" aria-hidden="true"></div>

      <section class="error_card" aria-labelledby="error_title">
        <a
          class="brand_link"
          href="/"
          aria-label="Go to the home page"
        >
          <span class="brand_link_logo">
            <img
              src="/assets/images/company_logo.png"
              alt="Company logo"
              width="640"
              height="640"
            />
          </span>
          <span class="brand_link_hint">Go to home page</span>
        </a>

        <div class="error_card_visual" aria-hidden="true">
          <span class="digit">4</span>
          <div class="socket">
            <span class="socket_ring"></span>
            <span class="socket_bolt"></span>
          </div>
          <span class="digit">4</span>
        </div>

        <p class="eyebrow">Error 404</p>
        <h1 id="error_title">This circuit leads nowhere.</h1>
        <p class="description">
          The page you’re looking for may have been moved, renamed, or never
          connected in the first place.
        </p>
      </section>
    </main>
  </body>
</html>
